<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel Debug</title>
<style>
body{background:#04060c;color:#eef2fa;font-family:system-ui;margin:0;padding:20px}
#dbg{position:fixed;top:8px;left:8px;right:8px;background:#000;border:2px solid #22d3ee;border-radius:10px;
padding:10px 14px;font:15px/1.7 monospace;color:#7df9ff;z-index:99;white-space:pre-wrap}
/* ==== EXACT carousel CSS from index.html ==== */
.carwrap{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:120px;-webkit-overflow-scrolling:touch}
.carwrap::-webkit-scrollbar{display:none}
.cargrid{display:flex;gap:20px;padding:4px 4px 18px;width:max-content;max-width:none}
.cargrid .comm-card{scroll-snap-align:center;min-width:min(340px,85%);margin:0;flex-shrink:0}
.comm-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;text-align:center;min-height:200px}
</style></head><body>
<div id="dbg">starting…</div>
<h2 style="margin-top:110px">Carousel debug (isolated)</h2>
<div class="carwrap" id="carousel"><div class="cargrid">
<div class="comm-card c1"><h3>Card A</h3></div>
<div class="comm-card c2"><h3>Card B</h3></div>
<div class="comm-card c3"><h3>Card C</h3></div>
</div></div>
<script>
var ticks=0,lastGo='-';
var dbg=document.getElementById('dbg');
setInterval(function(){
  var c=document.getElementById('carousel');
  dbg.textContent='ticks='+ticks+' lastGo='+lastGo+' hidden='+document.hidden+
   ' scrollLeft='+Math.round(c?c.scrollLeft:-1)+' idx='+(window.__idx!==undefined?window.__idx:'?');
},500);
(function(){
  const c=document.getElementById('carousel'); if(!c) return;
  const grid=c.querySelector('.cargrid');
  const real=[...grid.querySelectorAll('.comm-card')]; if(!real.length) return;
  real.forEach(k=>grid.appendChild(k.cloneNode(true)));
  const cards=[...grid.querySelectorAll('.comm-card')];
  const n=real.length;
  let idx=0,t=null,resume=null,resetT=null;
  window.__idx=0;
  function targetX(i){
    const k=cards[i],cr=c.getBoundingClientRect(),r=k.getBoundingClientRect();
    return c.scrollLeft+(r.left-cr.left)+r.width/2-cr.width/2;
  }
  function centerCard(i,instant){
    c.scrollTo({left:targetX(i),behavior:instant?'auto':'smooth'});
  }
  function go(i){
    clearTimeout(resetT);
    lastGo='go('+i+')';
    if(i===n){
      idx=n; window.__idx=n; centerCard(n,false);
      resetT=setTimeout(()=>{centerCard(0,true);idx=0;window.__idx=0},700);
    }else{
      idx=((i%n)+n)%n; window.__idx=idx; centerCard(idx,false);
    }
  }
  function play(){stop();t=setInterval(()=>{ticks++;if(document.hidden)return;go(idx+1)},2000)}
  function stop(){if(t){clearInterval(t);t=null}}
  function pauseTemp(){stop();clearTimeout(resume);resume=setTimeout(play,5000)}
  let syncT=null;
  c.addEventListener('scroll',()=>{clearTimeout(syncT);syncT=setTimeout(()=>{
    if(idx===n)return;
    const cr=c.getBoundingClientRect();let best=0,bd=1e9;
    real.forEach((k,i)=>{const r=k.getBoundingClientRect();
      const d=Math.abs((r.left+r.width/2)-(cr.left+cr.width/2));if(d<bd){bd=d;best=i}});
    idx=best; window.__idx=best;
  },140)},{passive:true});
  c.addEventListener('pointerdown',pauseTemp,{passive:true});
  c.addEventListener('wheel',pauseTemp,{passive:true});
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():play()});
  new IntersectionObserver(es=>es.forEach(e=>{e.isIntersecting?play():stop()}),{threshold:.15}).observe(c);
  window.carNav=d=>{pauseTemp();go(idx+d)};
})();
</script></body></html>
